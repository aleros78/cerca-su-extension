<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impostazioni – Cerca su…</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      .row { display: grid; grid-template-columns: 180px 1fr 100px; gap: 8px; align-items: center; margin-bottom: 8px; }
      input[type="text"] { width: 100%; padding: 6px 8px; }
      .hint { color: #555; font-size: 12px; margin: 8px 0 16px; }
      button { padding: 6px 10px; }
      .svc { border: 1px solid #ddd; padding: 8px; border-radius: 6px; margin-bottom: 8px; }
      .actions { display: flex; gap: 8px; }
      footer { margin-top: 16px; color: #666; font-size: 12px; }
      code { background: #f5f5f5; padding: 2px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Impostazioni – Cerca su…</h1>
    <p class="hint">Definisci i servizi per la ricerca. Usa il segnaposto <code>{q}</code> dove inserire il testo selezionato.</p>

    <div id="services"></div>

    <div class="actions">
      <button id="add">Aggiungi servizio</button>
      <button id="save">Salva</button>
      <button id="reset">Ripristina predefiniti</button>
    </div>

    <footer>
      Esempi URL: Google → <code>https://www.google.com/search?q={q}</code>,
      Wikipedia → <code>https://it.wikipedia.org/wiki/Speciale:Search?search={q}</code>
    </footer>

    <script src="options.js"></script>
  </body>
</html>
